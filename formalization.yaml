version: "v0.4"

project:
  name: "The Euclidean algorithm is not optimal among uniform processes"
  description: >-
    For every pair a ≥ b ≥ 1 there is a straight-line derivation of gcd(a, b) that
    uses only the remainder operation on available values and makes at most
    (3 + o(1)) log₂ a / log₂ log₂ a remainder calls, uniformly in b ≤ a; Euclid's algorithm
    needs about 1.44 log₂ a calls in the worst case. The proof stores a prefix of the
    Euclidean remainder sequence, shows that modulo every sufficiently large modulus at
    most three of its values share a residue class, and uses close residues to shrink the
    modulus by three remainder calls at a time.
    Consequently the intrinsic calls(rem)-complexities of the gcd and of coprimeness, in
    the sense of Moschovakis's Abstract Recursion and Intrinsic Complexity, are
    O(log a / log log a). This refutes Conjecture 3.4 of Moschovakis's 2012
    notes "Absolute lower bounds for uniform processes" and the version (4F-5) of the Main
    Conjecture in the book, both for the structure (ℕ, rem, eq0) and for
    Nε = (ℕ, rem, eq0, eq1). The Main Conjecture for algorithms (deterministic or
    nondeterministic recursive programs) is not addressed and remains open. Lower bounds
    are also formalized: every gcd certificate needs at least as many remainder facts as the
    shortest derivation, and the coprimeness complexity is at least (1 − ε) log₂ log₂ N on
    all but o(N²) coprime pairs below N.
  authors:
    - "Jason Davies"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jason Davies"

