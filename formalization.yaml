status:
  scope: >-
    Formalized: the upper bound G(a, b) ≤ (6 + ε) log₂ a / log₂ log₂ a for large a and all
    b ≤ a, where G is the least number of remainder calls in a straight-line derivation of
    gcd(a, b); the same bound for the three intrinsic complexities defined from certificates
    (coprimeness in Nε, gcd in (ℕ, rem, eq0), gcd in Nε); the refutations of Conjecture 3.4
    (real r and pairs, and the literal rational-r reading) and of (4F-5) (infinitely many
    pairs, in both structures, and the literal reading with a set on which the complexity is
    unbounded); the existence of certificates (for coprimeness when a, b ≥ 1, and for gcd for
    every pair); and the lower bounds G ≤ the gcd complexities, coprimeness complexity = G
    on positive coprime inputs, and the almost-all (1 − ε) log₂ log₂ N bound. The
    refutations of (4F-5) omit the book's first inequality calls(rem)(Eucl, x, y) ≤ L(x, y),
    which only weakens the statement refuted. Not formalized: the consequence for the
    question after Corollary 6C.7 (p. 188), which also uses the book's Theorem 4F.1, and
    the general theory of uniform processes; certificates are formalized directly as finite
    sets of facts. The library also proves a family of fixed nondeterministic programs with
    cost (3/p + o(1)) log₂ a; it is not part of the compared statements. The paper's
    register-program version of that family (bounded memory, no recursion) is proved in
    the paper and not yet formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

