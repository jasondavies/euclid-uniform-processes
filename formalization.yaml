status:
  scope: >-
    Formalized: the upper bound G(a, b) ≤ (3 + ε) log₂ a / log₂ log₂ a for large a and all
    b ≤ a, where G is the least number of remainder calls in a straight-line derivation of
    gcd(a, b); the same bound for the three intrinsic complexities defined from certificates
    (coprimeness in Nε, gcd in (ℕ, rem, eq0), gcd in Nε); the refutations of Conjecture 3.4
    (real r and pairs, and the literal rational-r reading) and of (4F-5) (infinitely many
    pairs, in both structures, and the literal reading with a set on which the complexity is
    unbounded); the existence of certificates (for coprimeness when a, b ≥ 1, and for gcd for
    every pair); and the lower bounds G ≤ the gcd complexities, coprimeness complexity = G
    on positive coprime inputs, and the almost-all (1 − ε) log₂ log₂ N bound; and the
    equality of the book's intrinsic complexities (§§1D, 4C–4E, ShortGCD.Book) with the
    fact-based ones. The
    refutations of (4F-5) omit the book's first inequality calls(rem)(Eucl, x, y) ≤ L(x, y),
    which only weakens the statement refuted. Not formalized: the consequence for the
    question after Corollary 6C.7 (p. 188), which also uses the book's Theorem 4F.1, and
    the general theory of uniform processes. The refutations use fact-based certificates,
    proved equal to the book's (Book.callsCoprimeness_eq, Book.callsRemGcd_eq,
    Book.callsGcd_eq). The library also proves the negative answer to van den Dries and
    Moschovakis's closure-depth question (ShortGCD.ClosureDepth.no_logarithmic_sequences,
    with g(a, b) ≤ 1 + G(a, rem(b, a))), and, for each p, a fixed nondeterministic register
    program with 3·2^p + 6 registers and no recursion stack whose cost is
    (3/p + o(1)) log₂ a, both as a register program in the book's syntax (§2F, with prime
    terms) and, written one function per line, as
    a tail-recursive program on the book's recursive machine
    (TailSource.arbitrarily_small_coefficient, TailRecursive.arbitrarily_small_coefficient).
    The register-program form is compared (correctness, totality and the ε log₂ a + B
    bound); the tail-recursive form is checked by Lean's kernel only.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

