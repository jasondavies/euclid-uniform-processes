alignment:
  namespace: "ShortGCD"
  statements:
    - source: "Paper, leading-coefficient corollary (Corollary 4)"
      lean: "ShortGCD.uniform_real_bound_three"
      module: "ShortGCD.SharpBound"
      status: proved
      note: "G(a, b) ≤ (3 + ε) log₂ a / log₂ log₂ a for all large a and every b ≤ a."
    - source: "Paper, Corollary 4 with the certificates proposition and the noncoprime remark"
      lean: "ShortGCD.uniform_intrinsic_bound_three"
      module: "ShortGCD.SharpCertificates"
      status: proved
      note: "The same bound for the three intrinsic complexities, for 0 < b ≤ a."
    - source: "Moschovakis 2012, Conjecture 3.4"
      lean: "ShortGCD.not_conjecture_3_4"
      module: "ShortGCD.Conjecture"
      status: proved
      note: "Real r > 0, infinitely many pairs a ≥ b ≥ 1."
    - source: "Moschovakis 2012, Conjecture 3.4 (literal reading)"
      lean: "ShortGCD.not_conjecture_3_4_literal"
      module: "ShortGCD.Conjecture"
      status: proved
      note: "Rational r > 0, infinitely many values of a."
    - source: "Moschovakis 2019, (4F-5), structure (ℕ, rem, eq0)"
      lean: "ShortGCD.not_main_conjecture_4F5"
      module: "ShortGCD.Conjecture"
      status: adapted
      note: "First inequality of (4F-5) dropped; D taken to be any infinite set of pairs."
    - source: "Moschovakis 2019, (4F-5), structure Nε"
      lean: "ShortGCD.not_main_conjecture_4F5_Neps"
      module: "ShortGCD.Conjecture"
      status: adapted
      note: "As above, with certificates that may use eq1 facts."
    - source: "Moschovakis 2019, (4F-5) with (4F-4)"
      lean: "ShortGCD.not_main_conjecture_4F5_literal"
      module: "ShortGCD.Conjecture"
      status: adapted
      note: "D any set on which the complexity is unbounded (condition (4F-4)); first inequality dropped."
    - source: "Paper, remark on noncoprime inputs (certificates exist)"
      lean: "ShortGCD.exists_certifiesCoprimeness"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "For a, b ≥ 1, some certificate settles a ⊥⊥ b, so callsCoprimeness is not sInf ∅."
    - source: "Paper, certificates proposition (certificates exist)"
      lean: "ShortGCD.exists_certifiesGcd"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "Every pair has a gcd certificate without eq1 facts, so callsGcd and callsRemGcd are not sInf ∅."
    - source: "Paper, certificates proposition (lower bound)"
      lean: "ShortGCD.G_le_callsRemGcd"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "Every gcd certificate in Nε has at least G(a, b) remainder facts."
    - source: "Paper, certificates proposition (lower bound)"
      lean: "ShortGCD.G_le_callsGcd"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "The same for certificates without eq1 facts."
    - source: "Paper, certificates proposition"
      lean: "ShortGCD.callsCoprimeness_eq_G"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "Coprimeness complexity equals G(a, b) on positive coprime inputs."
    - source: "Paper, almost-all lower bound"
      lean: "ShortGCD.tendsto_card_callsCoprimeness_loglog"
      module: "ShortGCD.LowerBounds"
      status: proved
      note: "The o(N²) count, with the same constant 40 as the paper's counting bound."
    - source: "Paper, program theorem (correctness)"
      lean: "ShortGCD.TailSource.executes_correct"
      module: "ShortGCD.TailSource"
      status: proved
      note: "Every convergent computation of the register program returns gcd(a, b)."
    - source: "Paper, program theorem (totality)"
      lean: "ShortGCD.TailSource.executes_total"
      module: "ShortGCD.TailSource"
      status: proved
      note: "With at least two work registers, every input has a convergent computation."
    - source: "Paper, program theorem (arbitrarily small coefficients)"
      lean: "ShortGCD.TailSource.arbitrarily_small_coefficient"
      module: "ShortGCD.TailSource"
      status: proved
      note: >-
        For every ε > 0, one fixed register program with 3·2^p + 6 registers (the two
        inputs and 3·2^p + 4 work registers), and no stack, has cost at most ε log₂ a + B on all
        1 ≤ b ≤ a. The paper's lim sup form (coefficient 3/p) is TailProgram.Fixed.limsup_profile_le.
    - source: "van den Dries and Moschovakis 2009, Open Problem (p. 2:11); paper, closure-depth corollary"
      lean: "ShortGCD.ClosureDepth.no_logarithmic_sequences"
      module: "ShortGCD.ClosureDepth"
      status: proved
      note: >-
        No positive integers αₙ → ∞, βₙ and C > 0 have g(αₙ, βₙ) > C log₂ αₙ for all n, with
        g the closure depth defined as in the source (iq(a, 0) = a, rem(a, 0) = a).
    - source: "Paper, fact-representation lemma; Moschovakis 2019, §§1D, 4C–4E (coprimeness in Nε)"
      lean: "ShortGCD.Book.callsCoprimeness_eq"
      module: "ShortGCD.BookCertificates"
      status: proved
      note: "The book's calls(rem)(Nε, ⊥⊥, a, b), from its own definitions, equals callsCoprimeness."
    - source: "Paper, fact-representation lemma; Moschovakis 2019, §§1D, 4C–4E (gcd in Nε)"
      lean: "ShortGCD.Book.callsRemGcd_eq"
      module: "ShortGCD.BookCertificates"
      status: proved
      note: "The book's calls(rem)(Nε, gcd, a, b) equals callsRemGcd."
    - source: "Paper, fact-representation lemma; Moschovakis 2019, §§1D, 4C–4E (gcd in N₀)"
      lean: "ShortGCD.Book.callsGcd_eq"
      module: "ShortGCD.BookCertificates"
      status: proved
      note: "The book's calls(rem)(N₀, gcd, a, b), with no eq1 entries, equals callsGcd."

acknowledgements: "Lean 4 and mathlib."
