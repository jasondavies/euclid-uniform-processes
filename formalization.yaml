fidelity:
  divergences: >-
    The book's (4F-5) asks for a set D satisfying (4F-3) and (4F-4) and two inequalities;
    the formal refutation drops the first inequality and (4F-3), keeping (4F-4) in the
    literal version, so the refuted statement is weaker than the book's. Conjecture 3.4 is
    refuted both for real r with infinitely many pairs and in its literal form (rational r,
    infinitely many a). Certificates are finite sets of remainder, eq0 and eq1 facts that are
    true in ℕ and generated by the inputs, with the Homomorphism Test as the defining
    condition: a finite partial substructure is represented by the finite set of its facts,
    and only the remainder facts are counted, as in calls(rem). This correspondence is
    formalized: ShortGCD.Book states the book's definitions (finite partial substructures
    with partial operations, generation, homomorphisms on the universe, certification and
    the calls(rem) norm) and proves that its intrinsic complexities equal the fact-based
    ones (Book.callsCoprimeness_eq, Book.callsRemGcd_eq, Book.callsGcd_eq).
    L(0, 0) is taken to be 0, agreeing with Lean's logarithm. Logarithms are base 2, which
    changes only constants.

