# Advisory mechanical preflight with Palomar's own reusable verifier, pinned to a fixed commit.
# It is not a submission and does not run on push: start it by hand from the Actions tab, or
# with `gh workflow run palomar-preflight.yml [-f request_id=...]`, on the exact commit you
# intend to submit. CI (ci.yml) does not run the comparator.
name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Caller-chosen lowercase identifier naming the preflight report artifact"
        required: false
        default: preflight001

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ inputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
